<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mapParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="islandLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Sombra del pergamino -->
  <rect x="5" y="6" width="54" height="48" rx="4" fill="#000000" opacity="0.6"/>

  <!-- Pergamino extendido con bordes tostados -->
  <path d="M6 5 C16 3 48 3 58 5 C59 12 57 44 58 51 C48 53 16 53 6 51 C5 44 7 12 6 5 Z" 
        fill="url(#mapParchment)" stroke="#78350f" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Esquinas enrolladas vintage -->
  <path d="M6 5 C9 9 12 9 14 5" fill="none" stroke="#b45309" stroke-width="1.2"/>
  <path d="M50 51 C52 47 55 47 58 51" fill="none" stroke="#b45309" stroke-width="1.2"/>

  <!-- Líneas de rumbo náutico (Portulano) -->
  <line x1="8" y1="28" x2="56" y2="28" stroke="#d97706" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4"/>
  <line x1="32" y1="7" x2="32" y2="49" stroke="#d97706" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.4"/>
  <circle cx="32" cy="28" r="16" fill="none" stroke="#d97706" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.3"/>

  <!-- Rosa de los Vientos (Arriba a la Izquierda) -->
  <g transform="translate(14, 13)">
    <circle cx="0" cy="0" r="4.5" fill="#fef3c7" stroke="#92400e" stroke-width="0.6"/>
    <!-- Flecha Norte Roja -->
    <polygon points="0,-6.5 1.5,-1.2 -1.5,-1.2" fill="#dc2626" stroke="#991b1b" stroke-width="0.5"/>
    <polygon points="0,6.5 1.5,1.2 -1.5,1.2" fill="#1e3a8a"/>
    <polygon points="6.5,0 1.2,1.5 1.2,-1.5" fill="#ca8a04"/>
    <polygon points="-6.5,0 -1.2,1.5 -1.2,-1.5" fill="#ca8a04"/>
    <text x="0" y="-7.5" font-family="'Press Start 2P', monospace" font-size="2.6" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>
  </g>

  <!-- Olas del mar en el océano -->
  <path d="M42 42 Q45 40 48 42 Q51 44 54 42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <path d="M10 38 Q13 36 16 38" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Silueta Geográfica Real de TENERIFE (Forma triangular icónica: Anaga al NE, Teno al O, Macizo Sur) -->
  <path d="M17 26 
           C18 22 23 20 28 20 
           L38 18 
           L48 11 
           L51 13 
           L46 19 
           L39 25 
           L37 34 
           L33 42 
           L27 41 
           L24 35 
           L15 31 
           Z" 
        fill="url(#islandLand)" stroke="#15803d" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Volcán El Teide (Centro neurálgico con nieve y caldera) -->
  <polygon points="29,29 35,29 32,23" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
  <polygon points="30.5,25.5 33.5,25.5 32,23" fill="#ffffff"/>
  <circle cx="32" cy="23" r="0.6" fill="#ef4444"/>

  <!-- Rótulo del mapa -->
  <text x="32" y="48" font-family="'Press Start 2P', monospace" font-size="3.2" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="0.4">TENERIFE</text>
</svg>
