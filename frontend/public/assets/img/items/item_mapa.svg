<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mapParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="islandLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Sombra del pergamino -->
  <rect x="7" y="9" width="50" height="48" rx="4" fill="#000000" opacity="0.6"/>

  <!-- Pergamino desenrollado con bordes envejecidos -->
  <path d="M8 8 C14 6 50 6 56 8 C57 14 55 50 56 56 C50 58 14 58 8 56 C7 50 9 14 8 8 Z" 
        fill="url(#mapParchment)" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>

  <!-- Rollo decorativo en las esquinas -->
  <path d="M8 8 C10 12 12 12 14 8" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <path d="M50 56 C52 52 54 52 56 56" fill="none" stroke="#b45309" stroke-width="1.5"/>

  <!-- Líneas de cuadrícula náutica / rumbo (Rumbos portulanos) -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#d97706" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#d97706" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#d97706" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Olas del Océano Atlántico -->
  <path d="M12 20 Q14 18 16 20 Q18 22 20 20" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <path d="M38 48 Q40 46 42 48 Q44 50 46 48" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <path d="M14 44 Q16 42 18 44" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Silueta Geográfica Real de la Isla de TENERIFE (Península de Anaga al NE, Teno al O, Macizo de Adeje al S) -->
  <path d="M20 30 
           L24 26 
           L32 23 
           L44 14 
           L47 16 
           L43 22 
           L36 30 
           L36 38 
           L33 44 
           L29 44 
           L24 38 
           L19 33 
           Z" 
        fill="url(#islandLand)" stroke="#15803d" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- El Volcán Teide en el centro de la isla -->
  <polygon points="29,29 33,29 31,24" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
  <polygon points="30.2,25.8 31.8,25.8 31,24" fill="#ffffff"/>
  <!-- Cráter minúsculo -->
  <circle cx="31" cy="24" r="0.6" fill="#ef4444"/>

  <!-- Rosa de los Vientos Náutica (Superior Izquierda) -->
  <g transform="translate(16, 16)">
    <!-- Círculo base -->
    <circle cx="0" cy="0" r="5" fill="#fef3c7" stroke="#92400e" stroke-width="0.8"/>
    <!-- Flecha Norte (Roja) -->
    <polygon points="0,-7 1.6,-1.5 -1.6,-1.5" fill="#dc2626" stroke="#991b1b" stroke-width="0.6"/>
    <!-- Flecha Sur (Azul marino) -->
    <polygon points="0,7 1.6,1.5 -1.6,1.5" fill="#1e3a8a" stroke="#172554" stroke-width="0.6"/>
    <!-- Flechas Este y Oeste -->
    <polygon points="7,0 1.5,1.6 1.5,-1.6" fill="#ca8a04"/>
    <polygon points="-7,0 -1.5,1.6 -1.5,-1.6" fill="#ca8a04"/>
    <!-- Letra N -->
    <text x="0" y="-8.5" font-family="'Press Start 2P', monospace, sans-serif" font-size="3" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>
  </g>

  <!-- Letrero inferior: TENERIFE -->
  <text x="32" y="53" font-family="'Press Start 2P', monospace, sans-serif" font-size="3.5" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="0.5">TENERIFE</text>
</svg>
