  <path d="M20 18 C18 14 19 11 22 11 C25 11 26 15 28 16 C30 15 32 11 35 11 C38 11 39 15 42 16 C44 15 45 11 47 12 C49 13 46 18 44 20 C40 22 24 22 20 18 Z" 
        fill="#b06c30" stroke="#2b1704" stroke-width="1.5" stroke-linejoin="round"/>

