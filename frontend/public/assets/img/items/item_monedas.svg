      <stop offset="90%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </radialGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c67d3c"/>
      <stop offset="50%" stop-color="#99582a"/>
      <stop offset="100%" stop-color="#603813"/>
