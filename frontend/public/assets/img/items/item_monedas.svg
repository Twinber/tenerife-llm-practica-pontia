  <circle cx="25" cy="32" r="1.3" fill="#e0a800"/>
  <circle cx="39" cy="32" r="1.3" fill="#e0a800"/>

  <!-- Monedas de Oro rebosando -->
  <circle cx="25" cy="13" r="5" fill="url(#coinGrad)" stroke="#5c4300" stroke-width="1.2"/>
  <circle cx="39" cy="13" r="5" fill="url(#coinGrad)" stroke="#5c4300" stroke-width="1.2"/>
  <circle cx="32" cy="10" r="6" fill="url(#coinGrad)" stroke="#5c4300" stroke-width="1.4"/>
  <circle cx="32" cy="10" r="4.2" fill="none" stroke="#fff8dc" stroke-width="0.9"/>
  <text x="32" y="13.5" font-family="'Press Start 2P', monospace" font-size="6" font-weight="bold" fill="#7a5700" text-anchor="middle">💰</text>

