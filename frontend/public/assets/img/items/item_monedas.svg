  <ellipse cx="32" cy="20" rx="14" ry="2.8" fill="none" stroke="#f6c342" stroke-width="2"/>
  <circle cx="32" cy="21" r="2.2" fill="#f6c342" stroke="#8c6200" stroke-width="1"/>
  <path d="M32 22 C30 25 26 28 25 31" fill="none" stroke="#f6c342" stroke-width="1.6" stroke-linecap="round"/>
