  <path d="M22 30 Q32 35 42 30" fill="none" stroke="#5c3412" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M24 39 Q32 44 40 39" fill="none" stroke="#5c3412" stroke-width="1.2" stroke-dasharray="2 2"/>

