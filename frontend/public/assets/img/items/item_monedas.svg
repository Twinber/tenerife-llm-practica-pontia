<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff68f"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="90%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </radialGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c67d3c"/>
      <stop offset="50%" stop-color="#99582a"/>
      <stop offset="100%" stop-color="#603813"/>
    </linearGradient>
    <filter id="retroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="0" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Sombra base -->
  <ellipse cx="32" cy="58" rx="22" ry="4" fill="#000" opacity="0.6"/>

  <!-- Pouch Body (Bolsa de Cuero) -->
  <path d="M18 26 C12 36 12 50 18 55 C23 58 41 58 46 55 C52 50 52 36 46 26 C42 28 38 29 32 29 C26 29 22 28 18 26 Z" 
        fill="url(#pouchGrad)" stroke="#2b1704" stroke-width="2" stroke-linejoin="round"/>

  <!-- Cuello arrugado de la bolsa -->
  <path d="M20 22 C18 18 19 15 22 15 C25 15 26 19 28 20 C30 19 32 15 35 15 C38 15 39 19 42 20 C44 19 45 15 47 16 C49 17 46 22 44 24 C40 26 24 26 20 22 Z" 
        fill="#b06c30" stroke="#2b1704" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Cuerda y lazo de cierre dorados -->
  <ellipse cx="32" cy="24" rx="14" ry="3" fill="none" stroke="#f6c342" stroke-width="2"/>
  <circle cx="32" cy="25" r="2.5" fill="#f6c342" stroke="#8c6200" stroke-width="1"/>
  <path d="M32 26 C30 30 26 33 25 36" fill="none" stroke="#f6c342" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M32 26 C34 30 38 33 39 36" fill="none" stroke="#f6c342" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Borlas de cuerda -->
  <circle cx="25" cy="37" r="1.5" fill="#e0a800"/>
  <circle cx="39" cy="37" r="1.5" fill="#e0a800"/>

  <!-- Monedas de Oro rebosando del cuello -->
  <!-- Moneda trasera izquierda -->
  <circle cx="25" cy="17" r="5" fill="url(#coinGrad)" stroke="#5c4300" stroke-width="1.2"/>
  <circle cx="25" cy="17" r="3.2" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="0.8"/>

  <!-- Moneda trasera derecha -->
  <circle cx="39" cy="17" r="5" fill="url(#coinGrad)" stroke="#5c4300" stroke-width="1.2"/>
  <circle cx="39" cy="17" r="3.2" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="0.8"/>

  <!-- Moneda central brillante principal -->
  <circle cx="32" cy="14" r="6" fill="url(#coinGrad)" stroke="#5c4300" stroke-width="1.4"/>
  <circle cx="32" cy="14" r="4.2" fill="none" stroke="#fff8dc" stroke-width="0.9"/>
  <!-- Símbolo grabado de moneda ($) -->
  <text x="32" y="17.5" font-family="'Press Start 2P', monospace, sans-serif" font-size="6" font-weight="bold" fill="#7a5700" text-anchor="middle">💰</text>

  <!-- Costuras y textura de cuero -->
  <path d="M22 35 Q32 40 42 35" fill="none" stroke="#5c3412" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M24 45 Q32 50 40 45" fill="none" stroke="#5c3412" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M20 40 Q21 48 24 53" fill="none" stroke="#ffaa55" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Destello de brillo retro -->
  <polygon points="41,10 42.5,13 45.5,14.5 42.5,16 41,19 39.5,16 36.5,14.5 39.5,13" fill="#ffffff"/>
  <circle cx="41" cy="14.5" r="1.2" fill="#ffff99"/>
</svg>
