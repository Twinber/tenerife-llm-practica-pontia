<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Sombra del billete -->
  <rect x="8" y="14" width="50" height="38" rx="3" fill="#000000" opacity="0.6"/>

  <!-- Billete de cartón con muescas perforadas en los lados -->
  <path d="M8 12 
           L54 12 
           A4 4 0 0 1 54 20 
           L54 36 
           A4 4 0 0 1 54 44 
           L54 50 
           L8 50 
           A4 4 0 0 1 8 42 
           L8 28 
           A4 4 0 0 1 8 20 
           Z" 
        fill="url(#ticketGrad)" stroke="#854d0e" stroke-width="2" stroke-linejoin="round"/>

  <!-- Línea de perforación troquelada (separador de matriz y talón) -->
  <line x1="42" y1="13" x2="42" y2="49" stroke="#a16207" stroke-width="1.4" stroke-dasharray="2 3"/>

  <!-- Muesca de taladro de interventor (agujero circular picado) -->
  <circle cx="42" cy="31" r="3" fill="#020617" stroke="#713f12" stroke-width="1"/>

  <!-- Icono central: Cabina de Teleférico y Cable -->
  <line x1="12" y1="20" x2="40" y2="34" stroke="#451a03" stroke-width="1.5"/>
  <!-- Brazo de sujeción -->
  <line x1="26" y1="27" x2="26" y2="31" stroke="#451a03" stroke-width="1.8"/>
  <!-- Cabina roja retro -->
  <rect x="20" y="31" width="12" height="9" rx="2" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <!-- Ventanillas de la cabina -->
  <rect x="22" y="33" width="3.5" height="4" rx="0.5" fill="#bae6fd"/>
  <rect x="26.5" y="33" width="3.5" height="4" rx="0.5" fill="#bae6fd"/>

  <!-- Texto: TELEFÉRICO DEL TEIDE -->
  <text x="25" y="18" font-family="'Press Start 2P', monospace, sans-serif" font-size="2.6" font-weight="bold" fill="#713f12" text-anchor="middle">TELEFÉRICO</text>
  <text x="25" y="46" font-family="'Press Start 2P', monospace, sans-serif" font-size="2.5" fill="#78350f" text-anchor="middle">PICO DEL TEIDE</text>

  <!-- Talón de control (a la derecha de la perforación) -->
  <text x="48" y="24" font-family="'Press Start 2P', monospace, sans-serif" font-size="2.2" fill="#78350f" text-anchor="middle">SUBIDA</text>
  <text x="48" y="32" font-family="'Press Start 2P', monospace, sans-serif" font-size="3" font-weight="bold" fill="#dc2626" text-anchor="middle">5💰</text>
  <text x="48" y="44" font-family="'Press Start 2P', monospace, sans-serif" font-size="1.8" fill="#a16207" text-anchor="middle">№3718</text>
</svg>
