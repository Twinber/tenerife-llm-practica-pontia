<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="passCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="paperEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>

  <!-- Sombra exterior -->
  <rect x="10" y="8" width="46" height="52" rx="4" fill="#000000" opacity="0.6"/>

  <!-- Borde de páginas interiores (efecto grosor libreta) -->
  <rect x="13" y="6" width="44" height="50" rx="3" fill="url(#paperEdge)" stroke="#52525b" stroke-width="1"/>
  <line x1="56" y1="8" x2="56" y2="54" stroke="#71717a" stroke-width="1.5" stroke-dasharray="1 2"/>

  <!-- Portada Azul Marino Imperial -->
  <rect x="9" y="5" width="45" height="52" rx="3" fill="url(#passCover)" stroke="#020617" stroke-width="1.8"/>

  <!-- Lomo / Pliegue del pasaporte -->
  <line x1="14" y1="5" x2="14" y2="57" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="15" y1="5" x2="15" y2="57" stroke="#000000" stroke-width="1" opacity="0.6"/>

  <!-- Marco Dorado de Filigrana -->
  <rect x="17" y="9" width="33" height="44" rx="2" fill="none" stroke="url(#goldFoil)" stroke-width="1.2"/>
  <rect x="19" y="11" width="29" height="40" rx="1.5" fill="none" stroke="url(#goldFoil)" stroke-width="0.7" stroke-dasharray="2 1"/>

  <!-- Esquinas ornamentadas en oro -->
  <polygon points="17,9 21,9 17,13" fill="url(#goldFoil)"/>
  <polygon points="50,9 46,9 50,13" fill="url(#goldFoil)"/>
  <polygon points="17,53 21,53 17,49" fill="url(#goldFoil)"/>
  <polygon points="50,53 46,53 50,49" fill="url(#goldFoil)"/>

  <!-- Título Superior: PASAPORTE -->
  <text x="33.5" y="18" font-family="'Press Start 2P', monospace, sans-serif" font-size="3.2" font-weight="bold" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="0.5">PASAPORTE</text>
  <text x="33.5" y="23" font-family="'Press Start 2P', monospace, sans-serif" font-size="2.6" fill="#fde047" text-anchor="middle">TENERIFE</text>

  <!-- Escudo Central Dorado (Islas y Sol) -->
  <circle cx="33.5" cy="33" r="8" fill="none" stroke="url(#goldFoil)" stroke-width="1.2"/>
  <!-- Sol y Volcán central -->
  <polygon points="33.5,28 37,34 30,34" fill="url(#goldFoil)" stroke="#78350f" stroke-width="0.6"/>
  <polygon points="33.5,28 35,30 32,30" fill="#fef08a"/>
  <!-- 7 Islas Canarias estilizadas alrededor -->
  <circle cx="33.5" cy="27" r="0.8" fill="#fde047"/>
  <circle cx="39" cy="31" r="0.8" fill="#fde047"/>
  <circle cx="39" cy="36" r="0.8" fill="#fde047"/>
  <circle cx="35" cy="39" r="0.8" fill="#fde047"/>
  <circle cx="32" cy="39" r="0.8" fill="#fde047"/>
  <circle cx="28" cy="36" r="0.8" fill="#fde047"/>
  <circle cx="28" cy="31" r="0.8" fill="#fde047"/>

  <!-- Cinta marcador roja / sello de seguridad inferior -->
  <polygon points="30,51 37,51 33.5,55" fill="#dc2626" stroke="#991b1b" stroke-width="0.8"/>
  <text x="33.5" y="47" font-family="'Press Start 2P', monospace, sans-serif" font-size="2.5" fill="url(#goldFoil)" text-anchor="middle">EXPLORADOR</text>

  <!-- Brillo dorado diagonal -->
  <path d="M12 8 L24 8 L16 28 L12 20 Z" fill="#ffffff" opacity="0.15"/>
</svg>
