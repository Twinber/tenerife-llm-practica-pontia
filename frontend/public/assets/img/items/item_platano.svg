<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="bananaRidge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </linearGradient>
  </defs>

  <!-- Sombra curva en el suelo -->
  <ellipse cx="32" cy="48" rx="22" ry="4" fill="#000000" opacity="0.6"/>

  <!-- Plátano Canario curvado estilizado más horizontal -->
  <path d="M10 22 
           C14 28 26 44 48 44 
           C52 44 55 41 54 37 
           C49 28 36 17 18 17 
           C14 17 11 19 10 22 Z" 
        fill="url(#bananaGrad)" stroke="#5d4037" stroke-width="2" stroke-linejoin="round"/>

  <!-- Arista / Lomo con brillo -->
  <path d="M16 19 
           C32 24 44 32 50 39" 
        fill="none" stroke="url(#bananaRidge)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Tallo verde superior -->
  <path d="M10 22 C9 19 8 16 7 15 C6 14 5 15 6 17 C7 19 8 22 10 24 Z" 
        fill="#689f38" stroke="#33691e" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="6.5" cy="15.5" r="1" fill="#33691e"/>

  <!-- Punta oscura inferior (resto floral) -->
  <path d="M52 42 C54 43 55 42 54 40 C53 39 51 40 52 42 Z" 
        fill="#3e2723" stroke="#212121" stroke-width="1"/>

  <!-- Auténticas "Motitas" dulces del Plátano de Canarias (IGP) -->
  <circle cx="20" cy="24" r="0.9" fill="#4e342e"/>
  <circle cx="24" cy="29" r="1.2" fill="#3e2723"/>
  <circle cx="28" cy="26" r="0.8" fill="#4e342e"/>
  <circle cx="32" cy="32" r="1.3" fill="#3e2723"/>
  <circle cx="36" cy="35" r="1" fill="#4e342e"/>
  <circle cx="40" cy="37" r="1.2" fill="#3e2723"/>
  <circle cx="44" cy="39" r="0.9" fill="#4e342e"/>
  <circle cx="47" cy="40" r="1.1" fill="#3e2723"/>
  <circle cx="27" cy="33" r="0.8" fill="#4e342e"/>

  <!-- Pegatina azul IGP Plátano de Canarias -->
  <ellipse cx="31" cy="29" rx="3.5" ry="2.5" fill="#0284c7" stroke="#0369a1" stroke-width="0.7" transform="rotate(-15 31 29)"/>
  <circle cx="31" cy="29" r="1.2" fill="#fde047"/>
</svg>
