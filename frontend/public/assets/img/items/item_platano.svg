<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="bananaRidge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff59d"/>
    </linearGradient>
  </defs>

  <!-- Sombra curva en el suelo -->
  <ellipse cx="32" cy="54" rx="22" ry="5" fill="#000000" opacity="0.6"/>

  <!-- Cuerpo del Plátano Canario curvado -->
  <path d="M14 15 
           C18 20 28 42 46 47 
           C50 48 54 45 53 41 
           C49 32 38 18 20 12 
           C17 11 15 12 14 15 Z" 
        fill="url(#bananaGrad)" stroke="#5d4037" stroke-width="2" stroke-linejoin="round"/>

  <!-- Arista / Lomo con brillo -->
  <path d="M19 14 
           C32 20 44 32 49 43" 
        fill="none" stroke="url(#bananaRidge)" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>

  <!-- Tallo verde superior -->
  <path d="M14 15 C13 13 11 10 10 9 C9 8 8 9 9 11 C10 13 12 16 14 17 Z" 
        fill="#689f38" stroke="#33691e" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="9.5" cy="9.5" r="1.2" fill="#33691e"/>

  <!-- Punta oscura inferior (resto floral) -->
  <path d="M51 45 C53 46 55 45 54 43 C53 42 51 43 51 45 Z" 
        fill="#3e2723" stroke="#212121" stroke-width="1"/>

  <!-- Auténticas "Motitas" dulces del Plátano de Canarias (IGP) -->
  <!-- Pequeños puntos marrones característicos -->
  <circle cx="24" cy="22" r="1" fill="#4e342e"/>
  <circle cx="27" cy="26" r="1.3" fill="#3e2723"/>
  <circle cx="29" cy="23" r="0.8" fill="#4e342e"/>
  <circle cx="33" cy="29" r="1.2" fill="#3e2723"/>
  <circle cx="36" cy="33" r="1" fill="#4e342e"/>
  <circle cx="35" cy="37" r="1.4" fill="#3e2723"/>
  <circle cx="39" cy="37" r="0.9" fill="#4e342e"/>
  <circle cx="42" cy="41" r="1.2" fill="#3e2723"/>
  <circle cx="45" cy="43" r="0.8" fill="#4e342e"/>
  <circle cx="47" cy="45" r="1" fill="#3e2723"/>
  <circle cx="30" cy="32" r="0.9" fill="#4e342e"/>
  <circle cx="23" cy="18" r="0.7" fill="#4e342e"/>

  <!-- Pequeño adhesivo azul retro de calidad / meme (IGP Plátano de Canarias) -->
  <ellipse cx="33" cy="31" rx="4" ry="3" fill="#0284c7" stroke="#0369a1" stroke-width="0.8" transform="rotate(-30 33 31)"/>
  <circle cx="33" cy="31" r="1.5" fill="#fde047"/>
</svg>
