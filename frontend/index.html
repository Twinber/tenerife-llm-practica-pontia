<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twinber en Tenerife - 1990 LucasArts VGA Adventure Demo</title>
  <link rel="stylesheet" href="css/retro.css">
</head>
<body>

  <!-- Barra de Control Superior -->
  <header class="demo-header">
    <div class="demo-title">🌴 TWINBER EN TENERIFE // SCUMM POINT & CLICK ENGINE</div>
    <div class="demo-controls">
      <button id="btn-crt" class="demo-btn">📺 CRT SCANLINES</button>
      <button id="btn-audio" class="demo-btn">🔊 AUDIO</button>
      <button id="btn-console" class="demo-btn">~ CONSOLA</button>
    </div>
  </header>

  <!-- Pantalla del Juego (640x360 con escalado entero retro) -->
  <main class="game-screen">

    <!-- 1. ESCENARIO GRÁFICO (VIEWPORT 640x240) -->
    <section class="scene-viewport" id="scene-viewport">
      <img class="scene-background" src="assets/img/bg_puerto_de_la_cruz.jpg" alt="Puerto de la Cruz">

      <!-- Subtítulos de Diálogo (Amarillo Twinber / Cian Paco) -->
      <div class="dialogue-overlay" id="dialogue-container"></div>

      <!-- Hotspots Interactivos del Muelle -->
      <div id="hotspot-barca" class="hotspot" style="left: 12%; bottom: 18%; width: 22%; height: 28%;" title="Barca El Mojo"></div>
      <div id="hotspot-teide" class="hotspot" style="left: 55%; top: 4%; width: 25%; height: 32%;" title="El Teide"></div>
      <div id="hotspot-casa" class="hotspot" style="left: 62%; top: 24%; width: 34%; height: 42%;" title="Casa Colonial Balcón de Tea"></div>
      <div id="hotspot-paco" class="hotspot" style="left: 74%; bottom: 8%; width: 18%; height: 46%;" title="Paco el Pescador"></div>

      <!-- Actores: Sprites Animados Transparentes -->
      <img id="twinber-actor" class="sprite-actor" src="assets/img/sprites/twinber_idle_0.png" alt="Twinber">
      <img id="paco-actor" class="sprite-actor" src="assets/img/sprites/paco_idle_0.png" alt="Paco el Pescador">
    </section>

    <!-- 2. LÍNEA DE FRASE DINÁMICA SCUMM (640x24) -->
    <section class="sentence-bar">
      <div class="sentence-action" id="sentence-action">Caminar hacia el muelle...</div>
    </section>

    <!-- 3. CUADRO DE MANDOS SCUMM: VERBOS + INVENTARIO (640x96) -->
    <section class="scumm-panel">
      <!-- 3A. Matriz de Verbos -->
      <nav class="verb-matrix">
        <button class="verb-btn" data-verb="HABLAR">HABLAR</button>
        <button class="verb-btn" data-verb="MIRAR">MIRAR</button>
        <button class="verb-btn" data-verb="USAR">USAR</button>
        <button class="verb-btn active" data-verb="IR A">IR A</button>
        <button class="verb-btn" data-verb="CLIMA">CLIMA</button>
        <button class="verb-btn" data-verb="PENSAR">💡 PENSAR</button>
      </nav>

      <!-- 3B. Inventario de Twinber -->
      <div class="inventory-grid">
        <div class="inventory-slot" data-item="Bolsa de Monedas de Oro">
          <img src="assets/img/items/item_monedas.png" alt="Monedas">
          <span class="slot-badge">15 💰</span>
        </div>
        <div class="inventory-slot" data-item="Pasaporte de Explorador">
          <img src="assets/img/items/item_pasaporte.png" alt="Pasaporte">
          <span class="slot-badge">0/10</span>
        </div>
        <div class="inventory-slot" data-item="Álbum de Fotos">
          <img src="assets/img/items/item_album.png" alt="Álbum">
          <span class="slot-badge">0/28</span>
        </div>
        <div class="inventory-slot" data-item="Brújula de Latón">
          <img src="assets/img/items/item_brujula.png" alt="Brújula">
        </div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
      </div>
    </section>

    <!-- Filtro CRT Retro (Scanlines de tubo) -->
    <div class="crt-overlay" id="crt-overlay"></div>

    <!-- Consola de Desarrollador Retro (Tecla ~) -->
    <aside class="crt-console" id="crt-console">
      <div>*** CONSOLA DE AUDITORÍA Y TELEMETRÍA RETRO (TECLA ~) ***</div>
      <div>-------------------------------------------------------</div>
    </aside>

  </main>

  <script src="js/game.js"></script>
</body>
</html>
