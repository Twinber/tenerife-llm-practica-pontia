apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: tenerife-game
spec:
  redirectScheme:
    scheme: https
    permanent: true
    port: "443"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenerife-ingress
  namespace: tenerife-game
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tenerife.example.com
      secretName: tenerife-tls
  rules:
    - host: tenerife.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenerife-game-svc
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenerife-redirect
  namespace: tenerife-game
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: tenerife-game-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: tenerife.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenerife-game-svc
                port:
                  number: 8080
